<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>New account &middot; Recykal.Market</title>
  <style>
    /* Same light palette as the buyer portal, because this flow hands straight
       over to it - a new buyer should not feel two different products. */
    :root {
      --ink: #0f1720;
      --muted: #6b7480;
      --line: #e6e8eb;
      --green: #12813f;
      --green-dark: #0d5c2d;
      --wash: #e8f5ed;
      --bg: #ffffff;
      --disabled: #eceef0;
      --disabled-ink: #9aa1a9;
      --red: #c0392b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 16px; line-height: 1.45;
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; flex: 1; display: flex; flex-direction: column; }

    .brandrow { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .mark {
      width: 34px; height: 34px; border-radius: 50%; background: #1b2936; color: #fff;
      display: grid; place-content: center; flex: none;
    }
    .brandrow strong { font-size: 21px; letter-spacing: -0.02em; color: #1b2936; }

    .card { border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; margin-top: 18px; }
    .rule { height: 1px; background: var(--line); margin: 22px -20px; }

    .step { font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }
    h1 { font-size: 27px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 800; margin: 0 0 6px; }
    .lede { color: var(--muted); font-size: 15.5px; margin: 0 0 22px; }

    label.k { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; margin: 0 0 7px; }
    .field { margin-bottom: 16px; }
    .field input[type=text], .field input[type=tel] {
      width: 100%; border: 1px solid var(--line); border-radius: 13px;
      padding: 13px 14px; font: 400 16px inherit; color: var(--ink); background: none; outline: none;
    }
    .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(18,129,63,0.10); }
    .field input::placeholder { color: #c2c7cd; }
    .hint { color: var(--muted); font-size: 13px; margin: 7px 0 0; }

    .phone { display: flex; align-items: center; gap: 0; }
    .phone .cc {
      border: 1px solid var(--line); border-right: 0; border-radius: 13px 0 0 13px;
      padding: 13px 12px; color: var(--muted); font-weight: 600; background: #fafbfc; flex: none;
    }
    /* width:100% above would add to the +91 prefix rather than share the row. */
    .phone input { flex: 1; min-width: 0; width: auto; border-radius: 0 13px 13px 0; }

    .otp {
      width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 14px;
      text-align: center; letter-spacing: 0.5em; font: 700 24px inherit; color: var(--ink);
      background: none; outline: none;
    }
    .otp:focus { border-color: var(--green); }

    .checks { margin: 20px 0 4px; }
    .check { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 14px; cursor: pointer; }
    .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--green); flex: none; }
    .check span { font-size: 13.5px; line-height: 1.45; }
    .check a { color: var(--ink); font-weight: 700; }

    .cta {
      width: 100%; border: 0; border-radius: 12px; cursor: pointer; margin-top: 8px;
      background: linear-gradient(180deg, #178b45 0%, var(--green-dark) 100%);
      color: #fff; font: 800 14px inherit; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 18px 20px;
    }
    .cta:disabled { background: var(--disabled); color: var(--disabled-ink); cursor: not-allowed; }
    .linkbtn { background: none; border: 0; color: var(--green); font: 700 14.5px inherit; cursor: pointer; padding: 0; }
    .err { color: var(--red); font-size: 13.5px; margin: 10px 0 0; text-align: center; min-height: 18px; }

    .doc {
      display: flex; align-items: center; gap: 14px;
      border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .doc .ico { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-content: center; color: var(--muted); flex: none; background: #fafbfc; }
    .doc.done .ico { background: var(--wash); border-color: transparent; color: var(--green); }
    .doc .n { font-weight: 700; font-size: 15px; }
    .doc .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .doc.done .s { color: var(--green); font-weight: 700; }
    .doc .up {
      border: 1px solid var(--line); background: #f6f7f8; border-radius: 10px;
      padding: 10px 15px; font: 800 11px inherit; letter-spacing: 0.09em; text-transform: uppercase; cursor: pointer;
    }
    .doc .tick { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-content: center; flex: none; }

    .final { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 4px; }
    .final .big { width: 92px; height: 92px; border-radius: 50%; background: var(--wash); color: var(--green); display: grid; place-content: center; margin-bottom: 22px; }
    .final h1 { margin-bottom: 10px; }
    .note {
      border: 1px solid #c5e1d4; background: #eaf3ef; border-radius: 16px;
      padding: 20px; margin-top: 26px; font-size: 15.5px; line-height: 1.55;
    }
    .note strong { color: var(--green-dark); }
    .closing { display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--green); font-weight: 700; font-size: 13.5px; margin-top: 18px; }
  </style>
</head>
<body>

<div class="wrap" id="root"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICONS = {
  leaf: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>',
  doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>',
  tick: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>',
  bigtick: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>',
  wa: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.9 11.9 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.9-11.9C23.95 5.35 18.6 0 12.05 0Zm0 21.79a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 5.45 0 9.88 4.44 9.88 9.9 0 5.45-4.43 9.88-9.89 9.88Z"/></svg>'
};

// Kept in one place so a refresh mid-flow doesn't dump someone back to screen one.
const store = {
  get: (k) => sessionStorage.getItem('join.' + k) || '',
  set: (k, v) => sessionStorage.setItem('join.' + k, v)
};

const S = {
  screen: 'identity',
  name: store.get('name'),
  phone: store.get('phone'),
  ticket: store.get('ticket'),
  id: store.get('id'),
  company: '',
  otp: '',
  terms: false,
  declared: false,
  docs: { gst: false, pan: false, pcb: false },
  err: ''
};

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(out.error || res.statusText), { body: out });
  return out;
}

const brand = `
  <div class="brandrow">
    <div class="mark">${ICONS.leaf}</div>
    <strong>Recykal.Market</strong>
  </div>`;

/* ---------------------- screen 1: name + number ------------------------ */

function identity() {
  const ready = S.name.trim().length > 1 && S.phone.replace(/\D/g, '').length >= 10 && S.terms && S.declared;
  $('#root').innerHTML = `
    ${brand}
    <div class="card">
      <p class="step">Step 1 of 3</p>
      <h1>New account</h1>
      <p class="lede">Tell us who you are and verify your mobile number.</p>

      <div class="field">
        <label class="k" for="name">Your name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Full name" value="${esc(S.name)}" />
      </div>

      <div class="field">
        <label class="k" for="phone">Mobile number</label>
        <div class="phone">
          <span class="cc">+91</span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
                 maxlength="10" placeholder="9XXXXXXXXX" value="${esc(S.phone)}" />
        </div>
        <p class="hint">This is the number we will message you on. We'll send a one-time password to verify it.</p>
      </div>

      <div class="checks">
        <label class="check">
          <input id="terms" type="checkbox" ${S.terms ? 'checked' : ''} />
          <span>I have read and agree to the <a href="#">Terms &amp; Conditions</a> and
                <a href="#">Privacy Policy</a> of Recykal.market</span>
        </label>
        <label class="check">
          <input id="declared" type="checkbox" ${S.declared ? 'checked' : ''} />
          <span>I confirm that all details I've shared are true and belong to my business.
                <a href="#">Declarations</a></span>
        </label>
      </div>

      <button class="cta" id="go" ${ready ? '' : 'disabled'}>Send OTP</button>
      <p class="err">${esc(S.err)}</p>
    </div>`;

  $('#name').oninput = (e) => { S.name = e.target.value; sync(); };
  $('#phone').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); S.phone = e.target.value; sync(); };
  $('#terms').onchange = (e) => { S.terms = e.target.checked; sync(); };
  $('#declared').onchange = (e) => { S.declared = e.target.checked; sync(); };

  function sync() {
    $('#go').disabled = !(S.name.trim().length > 1 && S.phone.length >= 10 && S.terms && S.declared);
  }

  $('#go').onclick = async () => {
    S.err = ''; $('#go').disabled = true;
    try {
      await post('/api/signup/otp', { phone: S.phone });
      store.set('name', S.name); store.set('phone', S.phone);
      S.screen = 'otp';
      render();
    } catch (e) {
      S.err = e.body && e.body.error === 'bad_phone' ? 'That does not look like a mobile number.' : e.message;
      render();
    }
  };
}

/* --------------------------- screen 2: OTP ----------------------------- */

function otp() {
  $('#root').innerHTML = `
    ${brand}
    <div class="card">
      <p class="step">Step 1 of 3</p>
      <h1>Verify your number</h1>
      <p class="lede">We sent a 6-digit code to <strong>+91 ${esc(S.phone)}</strong>.</p>

      <div class="field">
        <label class="k" for="code">Enter 6-digit OTP</label>
        <input id="code" class="otp" type="text" inputmode="numeric" maxlength="6" placeholder="______" value="${esc(S.otp)}" />
      </div>

      <button class="cta" id="verify" ${S.otp.length === 6 ? '' : 'disabled'}>Verify OTP</button>
      <p class="err">${esc(S.err)}</p>
      <p style="text-align:center;margin:14px 0 0">
        <button class="linkbtn" id="back">Change number</button>
      </p>
    </div>`;

  const box = $('#code');
  box.focus();
  box.oninput = (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    S.otp = e.target.value;
    $('#verify').disabled = S.otp.length !== 6;
  };
  $('#back').onclick = () => { S.otp = ''; S.err = ''; S.screen = 'identity'; render(); };

  $('#verify').onclick = async () => {
    S.err = ''; $('#verify').disabled = true;
    try {
      // The number lands in the set here, before the documents step - so someone
      // who drops off at screen 3 is still a lead we can follow up.
      const out = await post('/api/signup/verify', { phone: S.phone, code: S.otp, name: S.name });
      S.id = out.id;
      S.ticket = out.ticket;
      store.set('id', out.id); store.set('ticket', out.ticket);
      S.screen = out.docs_done ? 'done' : 'documents';
      render();
    } catch (e) {
      S.err = e.body && e.body.error === 'bad_otp' ? 'Invalid OTP. Hint: use 987654' : e.message;
      S.otp = '';
      render();
    }
  };
}

/* ------------------------ screen 3: documents -------------------------- */

const DOCS = [
  { id: 'gst', label: 'GST Certificate' },
  { id: 'pan', label: 'PAN Card' },
  { id: 'pcb', label: 'PCB License' }
];

function documents() {
  const all = DOCS.every((d) => S.docs[d.id]) && S.company.trim().length > 1;
  $('#root').innerHTML = `
    ${brand}
    <div class="card">
      <p class="step">Step 2 of 3</p>
      <h1>Complete KYC</h1>
      <p class="lede">Upload your business documents so we can verify your account.</p>

      <div class="field">
        <label class="k" for="company">Registered business name</label>
        <input id="company" type="text" placeholder="As printed on your GST certificate" value="${esc(S.company)}" />
      </div>

      ${DOCS.map((d) => `
        <div class="doc ${S.docs[d.id] ? 'done' : ''}">
          <div class="ico">${ICONS.doc}</div>
          <div style="flex:1;min-width:0">
            <div class="n">${esc(d.label)}</div>
            <div class="s">${S.docs[d.id] ? 'Uploaded' : 'PDF or image, up to 5 MB'}</div>
          </div>
          ${S.docs[d.id]
            ? `<div class="tick">${ICONS.tick}</div>`
            : `<button class="up" data-doc="${d.id}">Upload</button>`}
        </div>`).join('')}

      <button class="cta" id="submit" ${all ? '' : 'disabled'}>Submit documents</button>
      <p class="err">${esc(S.err)}</p>
    </div>`;

  $('#company').oninput = (e) => {
    S.company = e.target.value;
    $('#submit').disabled = !(DOCS.every((d) => S.docs[d.id]) && S.company.trim().length > 1);
  };

  // A mock upload: this harness records that a document was provided, never a
  // file. Swapping in a real file input is the only change needed here.
  document.querySelectorAll('[data-doc]').forEach((b) => {
    b.onclick = () => { S.docs[b.dataset.doc] = true; render(); };
  });

  $('#submit').onclick = async () => {
    S.err = ''; $('#submit').disabled = true;
    try {
      await post('/api/signup/documents', { id: S.id, ticket: S.ticket, company: S.company, docs: S.docs });
      S.screen = 'done';
      render();
    } catch (e) {
      S.err = (e.body && e.body.error) || e.message;
      render();
    }
  };
}

/* --------------------------- screen 4: done ---------------------------- */
/* No login button, deliberately. There is nothing for them to sign in to yet,
   and the next thing that happens is a WhatsApp message from us.             */

function done() {
  $('#root').innerHTML = `
    <div class="final">
      <div class="big">${ICONS.bigtick}</div>
      <h1>Documents submitted</h1>
      <p class="lede" style="margin:0">Your account is with our team for review.</p>

      <div class="note">
        Your part is done. <strong>We'll get back to you as soon as your account is approved</strong> —
        usually within one working day.
      </div>

      <p class="lede" style="margin:22px 0 0">
        You can close WhatsApp now. We'll message you on
        <strong style="color:var(--ink)">+91 ${esc(S.phone)}</strong> the moment you're approved,
        and you can start buying straight from that message.
      </p>

      <div class="closing">${ICONS.wa} Watch for a message from us</div>
    </div>`;
}

/* ------------------------------- router -------------------------------- */

function render() {
  ({ identity, otp, documents, done })[S.screen]();
  S.err = '';
}

// A permanent public URL gets re-tapped. If this handset already finished, open
// on the closing screen rather than asking for the same number a second time.
async function boot() {
  if (S.phone) {
    try {
      const r = await fetch('/api/signup/status?phone=' + encodeURIComponent(S.phone)).then((x) => x.json());
      if (r.known && r.docs_done) {
        S.screen = 'done';
        return render();
      }
    } catch (e) { /* offline is not a reason to block the form */ }
  }
  render();
}

boot();
</script>
</body>
</html>
